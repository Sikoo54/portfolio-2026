<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0e0a20"/>
      <stop offset="100%" stop-color="#181233"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7ecd4"/>
      <stop offset="50%" stop-color="#e8c58f"/>
      <stop offset="100%" stop-color="#d9a05f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aa8dd"/>
      <stop offset="45%" stop-color="#b06bd6"/>
      <stop offset="100%" stop-color="#ffd3e2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9374ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9374ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2a2050"/>
      <stop offset="100%" stop-color="#181233"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#f7ecd4" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Vinyl record -->
  <g transform="translate(400,250)">
    <!-- Outer ring -->
    <circle r="140" fill="none" stroke="url(#ring)" stroke-width="4"/>
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3 8" stroke-linecap="round"/>
    <!-- Vinyl body -->
    <circle r="130" fill="url(#vinyl)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Grooves -->
    <circle r="110" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
    <circle r="90" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
    <circle r="70" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
    <circle r="50" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>
    <!-- Shine arc -->
    <path d="M-90 -90 A127 127 0 0 1 -40 -122" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round"/>
    <!-- Label -->
    <circle r="35" fill="url(#gold)"/>
    <circle r="35" fill="none" stroke="rgba(24,18,51,0.3)" stroke-width="0.8"/>
    <text y="4" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#181233">S</text>
    <circle r="2.5" fill="#181233"/>
    <!-- Star accent -->
    <path d="M115 -120 L117 -115 L122 -113 L117 -111 L115 -106 L113 -111 L108 -113 L113 -115 Z" fill="#f7ecd4"/>
    <circle cx="-110" cy="100" r="2.5" fill="#ffd3e2"/>
  </g>

  <!-- Text -->
  <text x="400" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#e8c58f" opacity="0.6">lofi hiphop for your soul</text>
</svg>