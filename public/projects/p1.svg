<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F7F3EC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F7F3EC" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cut">
      <path d="M 0 0 H 680 L 800 120 V 500 H 0 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Red accent corner -->
  <g clip-path="url(#cut)">
    <rect width="800" height="500" fill="#DA1E28"/>
    <path d="M 680 0 L 800 120 V 0 Z" fill="#1A1A1A"/>
  </g>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#F7F3EC" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Coffee cup -->
  <g transform="translate(400,220)">
    <!-- Steam -->
    <path d="M-15,-80 C-15,-100 -5,-110 -5,-130" fill="none" stroke="url(#steam)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M0,-85 C0,-105 10,-115 10,-135" fill="none" stroke="url(#steam)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <path d="M15,-80 C15,-100 25,-110 25,-130" fill="none" stroke="url(#steam)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

    <!-- Cup body -->
    <path d="M-60,-60 L-50,60 L50,60 L60,-60 Z" fill="#F7F3EC" stroke="#D4A94C" stroke-width="2"/>
    <path d="M-60,-60 L60,-60" stroke="#D4A94C" stroke-width="3"/>

    <!-- Cup handle -->
    <path d="M60,-40 H80 V20 H60" stroke="#F7F3EC" stroke-width="6" fill="none" stroke-linejoin="miter"/>

    <!-- Coffee surface -->
    <ellipse cx="0" cy="-50" rx="55" ry="12" fill="#3D1C0B"/>
    <ellipse cx="0" cy="-50" rx="45" ry="9" fill="#5C2D0F"/>

    <!-- Saucer -->
    <ellipse cx="0" cy="70" rx="75" ry="15" fill="#F7F3EC" stroke="#D4A94C" stroke-width="1.5"/>
    <ellipse cx="0" cy="70" rx="60" ry="12" fill="none" stroke="#D4A94C" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Corner decorations -->
  <g stroke="#D4A94C" stroke-width="2" fill="none" opacity="0.6">
    <path d="M30,30 L30,50 M30,30 L50,30"/>
    <path d="M770,30 L770,50 M770,30 L750,30"/>
    <path d="M30,470 L30,450 M30,470 L50,470"/>
    <path d="M770,470 L770,450 M770,470 L750,470"/>
  </g>

  <!-- Text -->
  <text x="400" y="420" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="48" fill="#F7F3EC" letter-spacing="0.15em" opacity="0.15">LEBLANC</text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#D4A94C" opacity="0.5">EVERY CUP COUNTS.</text>

  <!-- Gold diamond accent -->
  <g transform="translate(400,360)" fill="#D4A94C" opacity="0.4">
    <rect x="-3" y="-3" width="6" height="6" transform="rotate(45)"/>
  </g>
</svg>